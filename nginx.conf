user root;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
  worker_connections 768;
  # multi_accept on;
}

http {

  ##
  # Basic Settings
  ##

  sendfile on;
  tcp_nopush on;
  types_hash_max_size 2048;

  # server_tokens off;

  # server_names_hash_bucket_size 64;
  # server_name_in_redirect off;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  ##
  # SSL Settings
  ##

  #ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
  #ssl_prefer_server_ciphers on;

  ##
  # Logging Settings
  ##

  access_log /var/log/nginx/access.log;

  ##
  # Gzip Settings
  ##

  gzip on;

  # gzip_vary on;
  # gzip_proxied any;
  # gzip_comp_level 6;
  # gzip_buffers 16 8k;
  # gzip_http_version 1.1;
  # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  ##
  # Virtual Host Configs
  ##

  #include /etc/nginx/conf.d/*.conf;
  #include /etc/nginx/sites-enabled/*;
  server {
    server_name carroption.ir www.carroption.ir caroptionshop.ir www.caroptionshop.ir;   # or _ for all
    client_max_body_size 1G;


    location /media/ {
      alias /root/projects/pzonouz-caroption-backend-golang/uploads/;
      autoindex on;
      expires off;
    }

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
    location /backend/ {
      proxy_pass http://127.0.0.1:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    }
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # listen 443 ssl http2; # managed by Certbot
    # ssl_certificate /etc/letsencrypt/live/caroptionshop.ir/fullchain.pem; # managed by Certbot
    # ssl_certificate_key /etc/letsencrypt/live/caroptionshop.ir/privkey.pem; # managed by Certbot
    # include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    listen 443 ssl http2;
    ssl_certificate /root/.lego/certificates/caroptionshop.ir.crt;
    ssl_certificate_key /root/.lego/certificates/caroptionshop.ir.key;




  
}


  server {
    if ($host = www.caroptionshop.ir) {
      return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = caroptionshop.ir) {
      return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.carroption.ir) {
      return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = carroption.ir) {
      return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name carroption.ir www.carroption.ir caroptionshop.ir www.caroptionshop.ir;
    return 404; # managed by Certbot








  }}



